[package]
name = "fatrocu-server"
version = "3.1.0-beta.1"
edition = "2024"
description = "Verified llama.cpp and multimodal model setup for Windows and Linux"
license = "MIT"

[dependencies]
fatrocu-cli = { path = "../fatrocu-cli" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
